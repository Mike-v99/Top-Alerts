# railway.toml — Backend (top-alerts-engine)
# Deploy at: railway.app — connect your GitHub repo, select this folder

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Set these in Railway's Variables dashboard (never commit real values):
# SUPABASE_URL, SUPABASE_SERVICE_KEY
# UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
# FINNHUB_API_KEY, TWELVE_DATA_API_KEY
# RESEND_API_KEY, ONESIGNAL_APP_ID, ONESIGNAL_API_KEY
# TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# STRIPE_PRO_PRICE_ID, STRIPE_TEAM_PRICE_ID
# NODE_ENV=production
# PORT=3000
